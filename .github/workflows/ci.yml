name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        stability: [prefer-stable]
        include:
          # Each Laravel major pairs with one Orchestra Testbench major.
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # Catch regressions against the lowest allowed dependency versions.
          - php: '8.2'
            laravel: '11'
            testbench: '9'
            stability: prefer-lowest
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
