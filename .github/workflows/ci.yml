name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to major-version tags for readability. For stronger
# supply-chain guarantees, pin each one to a full commit SHA (with the tag in
# a trailing comment) and let Dependabot keep them current.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-quality-${{ hashFiles('composer.json') }}
          restore-keys: composer-quality-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer lint

      - name: PHPStan
        run: composer analyse

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11', '12', '13']
        stability: [prefer-stable]
        include:
          # Each Laravel major pairs with one Orchestra Testbench major.
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # Catch regressions against the lowest allowed dependency versions.
          - php: '8.2'
            laravel: '11'
            testbench: '9'
            stability: prefer-lowest
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
